name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Monthly test run, so CI goes red when the rates roll over (tests/rollover.test.mjs fails once the
  # current income year has ended). Scheduled runs only test; they never deploy.
  schedule:
    - cron: '17 21 1 * *' # 21:17 UTC on the 1st = early morning on the 2nd in Australia

# Read-only by default. Only the deploy job gets the extra Pages permissions it needs.
permissions:
  contents: read

# Actions are pinned to a full commit SHA (the tag is in the comment) so a moved tag
# can't change what runs. Update both together when upgrading.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: scripts/seo.mjs dates sitemap entries from each page's last commit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm test
      # Generated sections (explainers, FAQ, JSON-LD, head tags, CSP, preloads, service worker hashes) must
      # match their generators: regenerate and fail if anything changed.
      - name: Generated files are up to date
        run: python3 scripts/content.py && node scripts/seo.mjs && git diff --exit-code

  deploy:
    needs: test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push cancels an older deploy still running.
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Only the site itself is published: tests, scripts, docs and the README stay out.
      - name: Collect site files
        run: |
          mkdir _site
          cp -r *.html manifest.webmanifest robots.txt sw.js css js img fonts tools _site/
          [ -f sitemap.xml ] && cp sitemap.xml _site/ || true
          [ -f CNAME ] && cp CNAME _site/ || true
          [ -f ads.txt ] && cp ads.txt _site/ || true
      # Stamp the service worker with this commit, so every deploy installs a fresh cache even if
      # VERSION wasn't bumped by hand (the worker serves cache-first, so a missed bump would leave
      # returning visitors on old files and rates).
      - name: Stamp service worker version
        run: |
          sed -i "s/^const VERSION = '[^']*';/const VERSION = '${GITHUB_SHA::12}';/" _site/sw.js
          grep -q "^const VERSION = '${GITHUB_SHA::12}';" _site/sw.js
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
