name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Only the deploy job gets the extra Pages permissions it needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

# Actions are pinned to a full commit SHA (the tag is in the comment) so a moved tag
# can't change what runs. Update both together when upgrading.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Only the site itself is published: tests, scripts, docs and the README stay out.
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html privacy.html 404.html manifest.webmanifest robots.txt sw.js css js img fonts tools _site/
          [ -f sitemap.xml ] && cp sitemap.xml _site/ || true
          [ -f CNAME ] && cp CNAME _site/ || true
          [ -f ads.txt ] && cp ads.txt _site/ || true
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
