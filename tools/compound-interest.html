<!doctype html>
<html lang="en-AU" data-base="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compound Interest Calculator (Australia) | ToolTiles</title>
  <meta name="description" content="Free compound interest calculator with regular deposits. See how savings grow year by year.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">
  <script type="module" src="../js/layout.js"></script>
  <script type="module" src="../js/pages/compound-interest.js"></script>
</head>
<body>
  <main class="wrap">
    <p class="crumbs"><a href="../">← All tools</a></p>
    <div class="tool-head">
      <h1>Compound Interest Calculator</h1>
      <p>See how savings grow with interest and regular contributions.</p>
    </div>
    <div class="cols">
      <form class="card" id="form">
        <div class="field"><label for="principal">Starting amount ($)</label><input type="number" id="principal" value="10000" min="0" inputmode="decimal"></div>
        <div class="field"><label for="rate">Interest rate (% p.a.)</label><input type="number" id="rate" value="5" step="0.01" min="0" inputmode="decimal"></div>
        <div class="field"><label for="years">Years</label><input type="number" id="years" value="10" min="1" max="100" inputmode="numeric"></div>
        <div class="field"><label for="comp">Compounding</label>
          <select id="comp"><option value="365">Daily</option><option value="12" selected>Monthly</option><option value="4">Quarterly</option><option value="1">Annually</option></select></div>
        <div class="field"><label for="contrib">Regular deposit ($)</label><input type="number" id="contrib" value="200" min="0" inputmode="decimal"></div>
        <div class="field"><label for="cfreq">Deposit frequency</label>
          <select id="cfreq"><option value="52">Weekly</option><option value="26">Fortnightly</option><option value="12" selected>Monthly</option><option value="1">Yearly</option></select></div>
      </form>
      <div class="card">
        <div>Final balance</div>
        <div class="result-big" id="balance">–</div>
        <div class="kv"><span>Total deposited</span><span id="contributed">–</span></div>
        <div class="kv"><span>Interest earned</span><span id="interest">–</span></div>
        <h2 class="section-title">Year by year</h2>
        <div class="table-scroll"><table><thead><tr><th>Year</th><th>Deposited</th><th>Interest</th><th>Balance</th></tr></thead><tbody id="rows"></tbody></table></div>
        <p class="disclaimer">Estimate only. Ignores tax, fees and rate changes.</p>
      </div>
    </div>
  </main>
</body>
</html>
