<!doctype html>
<html lang="en-AU" data-base="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mortgage Repayment Calculator (Australia) | ToolTiles</title>
  <meta name="description" content="Calculate weekly, fortnightly or monthly home loan repayments and total interest.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">
  <script type="module" src="../js/layout.js"></script>
  <script type="module" src="../js/pages/mortgage.js"></script>
</head>
<body>
  <main class="wrap">
    <p class="crumbs"><a href="../">← All tools</a></p>
    <div class="tool-head">
      <h1>Mortgage Repayment Calculator</h1>
      <p>Principal and interest repayments for an Australian home loan.</p>
    </div>
    <div class="cols">
      <form class="card" id="form">
        <div class="field"><label for="principal">Loan amount ($)</label><input type="number" id="principal" value="600000" min="0" inputmode="decimal"></div>
        <div class="field"><label for="rate">Interest rate (% p.a.)</label><input type="number" id="rate" value="6" step="0.01" min="0" inputmode="decimal"></div>
        <div class="field"><label for="years">Loan term (years)</label><input type="number" id="years" value="30" min="1" max="40" inputmode="numeric"></div>
        <div class="field"><label for="freq">Repayment frequency</label>
          <select id="freq"><option value="weekly">Weekly</option><option value="fortnightly">Fortnightly</option><option value="monthly" selected>Monthly</option></select></div>
      </form>
      <div class="card">
        <div id="freq-label">Monthly repayment</div>
        <div class="result-big" id="repayment">–</div>
        <div class="kv"><span>Total interest</span><span id="interest">–</span></div>
        <div class="kv"><span>Total repaid</span><span id="total">–</span></div>
        <p class="disclaimer">Estimate only. Assumes a constant rate and no fees. Not a loan offer or financial advice.</p>
      </div>
    </div>
  </main>
</body>
</html>
