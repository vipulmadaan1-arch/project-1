<!doctype html>
<html lang="en-AU" data-base="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Calculator | ToolTiles</title>
  <meta name="description" content="Free online calculator with brackets, percentages and keyboard support.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">
  <script type="module" src="../js/layout.js"></script>
  <script type="module" src="../js/pages/calculator.js"></script>
</head>
<body>
  <main class="wrap">
    <p class="crumbs"><a href="../">← All tools</a></p>
    <div class="tool-head">
      <h1>Calculator</h1>
      <p>Type on your keyboard or tap the keys. Supports brackets and percentages.</p>
    </div>
    <div class="card calc">
      <div class="calc-display" aria-live="polite">
        <div class="calc-expr" id="expr"></div>
        <div class="calc-out" id="out">0</div>
      </div>
      <div class="calc-keys" id="keys">
        <button data-k="C">C</button><button data-k="(">(</button><button data-k=")">)</button><button class="op" data-k="÷">÷</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="×">×</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="-">−</button>
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="+">+</button>
        <button data-k="%">%</button><button data-k="0">0</button><button data-k=".">.</button><button class="eq" data-k="=">=</button>
        <button data-k="⌫" style="grid-column: span 4">⌫ Delete</button>
      </div>
    </div>
  </main>
</body>
</html>
